<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>html,body{height:100%}body{margin:0}</style>
<title>2학년 2반 야간자율학습 현황</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Do+Hyeon&display=swap">
<style>
/* Layout: 요일 탭 → 그날 요약(남는 인원 + 그룹별 명단) → 주간 전체 격자 */
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#1B2420; --muted:#5E6B64; --line:#D9DFDA;
  --chalk:#2E6A4E; --chalk-soft:#E2EEE7;
  --out:#B0700A; --out-soft:#FBF0DC;
  --p1:#6E50A0; --p1-soft:#EEE8F7;
  --ok:#2F64A0; --ok-soft:#E3ECF7;
  --x:#A8473B; --x-soft:#F7E5E2;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A17; --panel:#1C2420; --ink:#E6ECE8; --muted:#97A49D; --line:#2E3934;
  --chalk:#7CC4A0; --chalk-soft:#1F3329;
  --out:#E8A94A; --out-soft:#3A2D16;
  --p1:#B79BE3; --p1-soft:#2E2640;
  --ok:#8AB4E8; --ok-soft:#1E2C3E;
  --x:#E58C80; --x-soft:#3C2320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A17; --panel:#1C2420; --ink:#E6ECE8; --muted:#97A49D; --line:#2E3934;
  --chalk:#7CC4A0; --chalk-soft:#1F3329;
  --out:#E8A94A; --out-soft:#3A2D16;
  --p1:#B79BE3; --p1-soft:#2E2640;
  --ok:#8AB4E8; --ok-soft:#1E2C3E;
  --x:#E58C80; --x-soft:#3C2320; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;letter-spacing:.01em}
header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tab{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 4px;cursor:pointer;font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.tab span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--bg)}
.tab[aria-selected="true"] span{color:var(--bg);opacity:.85}
.tab:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
.today{font-size:10px;letter-spacing:.06em}
.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;grid-template-columns:220px 1fr;gap:24px}
.big{display:flex;flex-direction:column;gap:14px}
.num{display:flex;flex-direction:column}
.num small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.num strong{font-family:var(--display);font-weight:400;font-size:52px;line-height:1;color:var(--chalk);font-variant-numeric:tabular-nums}
.num strong em{font-style:normal;font-size:20px;color:var(--muted);margin-left:4px}
.groups{display:flex;flex-direction:column;gap:16px;min-width:0}
.g h3{margin:0 0 8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.g h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.g h3 span{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:3px 10px;font-size:14px;background:var(--chalk-soft);color:var(--ink)}
.rows{display:grid;grid-template-columns:auto auto 1fr;gap:4px 14px;font-size:14px;align-items:baseline}
.rows .t{font-variant-numeric:tabular-nums;color:var(--out);font-weight:500;white-space:nowrap}
.rows .s{color:var(--muted)}
.empty{color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.gridbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px;table-layout:fixed}
col.cn{width:96px}col.cd{width:auto}col.cs{width:64px}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
thead th{font-weight:700;font-size:13px;background:var(--panel);position:sticky;top:0}
th.n{position:sticky;left:0;background:var(--panel);z-index:1;white-space:nowrap;font-weight:500}
th.n small{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px;display:inline-block;width:16px;text-align:right}
td.sel,th.sel{background:var(--chalk-soft)}
.c{display:block;border-radius:6px;padding:3px 6px;white-space:normal;word-break:keep-all;font-variant-numeric:tabular-nums}
.c.out{background:var(--out-soft);color:var(--out)}
.c.p1{background:var(--p1-soft);color:var(--p1);line-height:1.35}
.c.p1 b{font-weight:700}
.c.inn{background:var(--chalk-soft);color:var(--chalk);box-shadow:inset 0 0 0 1px var(--chalk);line-height:1.35}
.c.inn b{font-weight:700}
.chip small{color:var(--chalk);font-size:12px;margin-left:4px}
.c.ok{background:var(--ok-soft);color:var(--ok)}
.c.x{background:var(--x-soft);color:var(--x);text-align:center;font-weight:700}
tr.allx th.n{color:var(--x)}
h2{font-size:15px;margin:0;font-weight:700}
.star{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.star h2{font-family:var(--display);font-weight:400;font-size:22px;color:var(--chalk)}
.star p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stars{display:flex;flex-wrap:wrap;gap:8px}
.stars span{border-radius:999px;padding:5px 14px;font-size:16px;font-weight:700;background:var(--chalk);color:var(--bg)}
.near{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.near b{font-weight:500}
.near em{font-style:normal;color:var(--muted);font-size:12.5px;margin-left:4px}
.sub{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
th.n .badge{color:var(--chalk);margin-left:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px}
.phead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.wk{display:flex;gap:4px;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.ck button:focus-visible{outline:3px solid var(--chalk);outline-offset:1px}
.btn.danger{color:var(--x)}
.seg{display:inline-flex;margin-right:6px}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:8px 0 0 8px}.seg .btn:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.btn.on{background:var(--chalk);border-color:var(--chalk);color:var(--bg);font-weight:700}
.cklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:6px 24px}
.ck{display:grid;grid-template-columns:6em auto auto;justify-content:start;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
.ck .nm{font-size:15px;min-width:0;display:flex;align-items:baseline}
.ck .nmw{display:flex;flex-direction:column;white-space:nowrap}
.ck .nm small{display:block;color:var(--p1);font-size:11.5px;line-height:1.2}
.no{color:var(--muted);font-size:.8em;font-variant-numeric:tabular-nums;margin-right:4px;font-weight:400}
.ck button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:4px 0;width:64px;font:inherit;font-size:13px;cursor:pointer}
.ck button[aria-pressed="true"]{background:var(--x);border-color:var(--x);color:var(--panel);font-weight:700}
.ck button:disabled,.btn:disabled{opacity:.4;cursor:default}
.ck.miss .nm{color:var(--x);font-weight:700}
.loglist{display:flex;flex-direction:column;gap:8px}
.logday{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:14px;align-items:baseline}
.logday .d{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.logday .who{display:flex;flex-wrap:wrap;gap:4px 12px}
.logday .who em{font-style:normal;color:var(--x);font-size:12.5px;margin-left:3px}
.logday .who>span{display:inline-flex;align-items:baseline;gap:2px}
.del{appearance:none;border:1px solid transparent;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;border-radius:6px;padding:0 5px;margin-left:2px}
.del:hover{border-color:var(--line);color:var(--x)}
.del.armed{background:var(--x);color:var(--panel);border-color:var(--x)}
.del:focus-visible{outline:2px solid var(--chalk)}
.totals{display:flex;flex-wrap:wrap;gap:6px}
.totals span{border-radius:999px;padding:3px 10px;font-size:13.5px;background:var(--x-soft);color:var(--x)}
.totals b{font-variant-numeric:tabular-nums}
.totals small{font-size:11.5px;margin-left:6px;opacity:.85}
.rs{font:inherit;font-size:12px;padding:1px 2px;margin-left:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}
.rs.set{color:var(--ink);border-color:var(--muted)}
.rs.bad{color:var(--x);border-color:var(--x);font-weight:700}
.rs:focus-visible{outline:2px solid var(--chalk)}
.copybox{width:100%;min-height:120px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;box-sizing:border-box}
.toast{color:var(--chalk);font-size:13px;min-height:1em}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
@media (max-width:680px){
  .day{grid-template-columns:1fr;gap:18px;padding:16px}
  .big{flex-direction:row;gap:28px}
  .num strong{font-size:42px}
  .tab b{font-size:19px}
}
.lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;text-align:center}
.lock h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.lock label{color:var(--muted);font-size:13px}
.lock input{font-size:28px;letter-spacing:.5em;text-align:center;padding:10px 0 10px .5em;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--body)}
.lock input:focus-visible{outline:3px solid var(--chalk);outline-offset:1px}
.lock button{appearance:none;border:0;border-radius:10px;padding:11px;background:var(--chalk);color:var(--bg);font-size:15px;font-weight:700;cursor:pointer;font-family:var(--body)}
.lock p{margin:0;min-height:1.2em;color:var(--x);font-size:13px}
[hidden]{display:none!important}
</style>

</head>
<body>
<div class="lock" id="lock">
  <form id="lockform">
    <h1>2학년 2반 야간자율학습 현황</h1>
    <label for="pin">PIN 4자리를 입력하세요</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" autofocus>
    <button type="submit">열기</button>
    <p id="lockmsg" role="alert"></p>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <h1>2학년 2반 야간자율학습 현황</h1>
    <p>동아리·배드민턴·관악·합창부 활동은 칠판에 적고 출석 처리. 학원 보충은 수강증 받아 전날 아침까지 제출.</p>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <section class="day" id="day"></section>

  <section class="panel" id="check"></section>
  <section class="panel" id="log"></section>
  <section class="star" id="star"></section>

  <section class="sec">
    <div class="sechead">
      <h2>주간 전체 보기</h2>
      <div class="legend">
        <span><i style="background:var(--chalk-soft)"></i>야자 참여</span>
        <span><i style="background:var(--p1-soft)"></i>1교시만</span>
        <span><i style="background:var(--ok-soft)"></i>출석처리</span>
        <span><i style="background:var(--out-soft)"></i>학원·과외</span>
        <span><i style="background:var(--x-soft)"></i>불참(X)</span>
      </div>
    </div>
    <div class="gridbox"><table id="grid"></table></div>
  </section>
</div>

function tally(d){
  const g={in:[],p1:[],ok:[],out:[],x:[]};
  S.forEach((s,i)=>{const v=st(s,d);g[v.k].push({n:i+1,name:s[0],v})});

}

function renderTabs(){
  document.getElementById('tabs').innerHTML=DAYS.map((d,i)=>{
    const t=tally(d);

    return `<button class="tab" role="tab" id="tab-${i}" aria-selected="${d===cur}" data-d="${d}"><b>${d}</b><span>${cnt}</span>${i===todayIdx&&jsDay!==0?'<span class="today">오늘</span>':''}</button>`;
  }).join('');

}
function group(color,title,list,body){
  return `<div class="g"><h3><i style="background:${color}"></i>${title}<span>${list.length}명</span></h3>${list.length?body:'<div class="empty">없음</div>'}</div>`;
}
function renderDay(){
  const {g,p1,p2}=tally(cur);

  const rows=l=>`<div class="rows">${l.map(o=>`<span>${NO(o.name)}${esc(o.name)}</span><span class="t">${esc(o.v.t)}</span><span class="s">${esc(o.v.place)}${o.v.sub?' · '+esc(o.v.sub):''}</span>`).join('')}</div>`;

    <div class="big">

    </div>
    <div class="groups">
      ${group('var(--chalk)','끝까지 남는 학생',g.in,chips(g.in))}
      ${g.ok.length?group('var(--ok)','출석처리 (공동교육과정)',g.ok,chips(g.ok)):''}
      ${g.p1.length?group('var(--p1)','1교시만 하고 학원',g.p1,rows(g.p1)):''}
      ${group('var(--out)','학원·과외로 빠짐',g.out,rows(g.out))}
      ${group('var(--x)','불참 (X)',g.x,chips(g.x))}

}
function renderGrid(){
  const cell=(v,d)=>{
    if(v.k==='in')return v.note?`<span class="c inn"><b>참여</b><br>${esc(v.note)}</span>`:'';
    if(v.k==='x')return '<span class="c x">X</span>';
    if(v.k==='ok')return `<span class="c ok">${d==='토'?'공동':'공동교육과정'}</span>`;
    const lab=(v.place==='과외'?'과외 ':'')+(v.sub?v.sub+' ':'')+v.t;
    return v.k==='p1'?`<span class="c p1"><b>1교시 참여</b><br>${esc(lab)}</span>`:`<span class="c ${v.k}">${esc(lab)}</span>`;
  };
  const cols=`<colgroup><col class="cn">${DAYS.map(d=>`<col class="${d==='토'?'cs':'cd'}">`).join('')}</colgroup>`;
  const head=`<thead><tr><th class="n">이름</th>${DAYS.map(d=>`<th class="${d===cur?'sel':''}">${d}</th>`).join('')}</tr></thead>`;
  const body=S.map((s,i)=>{
    const allx=DAYS.every(d=>st(s,d).k==='x');
    return `<tr class="${allx?'allx':''}"><th class="n"><small>${i+1}</small>${esc(s[0])}${missed(s).length===0?'<span class="badge" title="개근">★</span>':''}</th>${DAYS.map(d=>`<td class="${d===cur?'sel':''}">${cell(st(s,d),d)}</td>`).join('')}</tr>`;
  }).join('');
  document.getElementById('grid').innerHTML=cols+head+'<tbody>'+body+'</tbody>';
}
const missed=s=>DAYS.filter(d=>!['in','ok'].includes(st(s,d).k));
function renderStar(){
  const full=S.filter(s=>missed(s).length===0);
  const near=S.filter(s=>missed(s).length===1);
  document.getElementById('star').innerHTML=`
    <div><h2>개근 학생 ${full.length}명</h2><p>월~토 한 번도 안 빠지고 야자 참여 (공동교육과정 출석처리는 참여로 셈)</p></div>
    ${full.length?`<div class="stars">${full.map(s=>`<span>${S.indexOf(s)+1} ${esc(s[0])}</span>`).join('')}</div>`:'<div class="empty">이번 주는 없음</div>'}
    ${near.length?`<div><div class="sub">하루만 빠지는 학생 ${near.length}명</div><div class="near">${near.map(s=>`<span><b>${NO(s[0])}${esc(s[0])}</b><em>${missed(s)[0]} 빠짐</em></span>`).join('')}</div></div>`:''}`;
}

const LS='yaja-absent';
let AB={};try{AB=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){AB={}}
const REASONS=['학원','가정','병결','무단'];
const fixR=r=>r==='보충'?'학원':r; // 예전 '보충' 기록은 '학원'으로 표시
let RS={};try{RS=JSON.parse(localStorage.getItem('yaja-reason')||'{}')||{}}catch(e){RS={}}
for(const k in RS)RS[k]=fixR(RS[k]);
let reasonOK=true; // 시트 코드가 사유를 지원하는지
const saveAB=()=>{try{localStorage.setItem(LS,JSON.stringify(AB));localStorage.setItem('yaja-reason',JSON.stringify(RS))}catch(e){}};
let wk=0, clearArmed=false, delArmed='', delTimer=0;
async function removeRec(key,name){
  const a=[...((AB[key]||{})[name]||[])];
  if(AB[key]){delete AB[key][name];if(!Object.keys(AB[key]).length)delete AB[key];}
  delete RS[key+'|'+name];
  renderCheck();renderLog();
  if(!API){saveAB();return}
  for(const p of a)await apiSet(key,name,p,false);
}
// 공유 모드: API(구글 시트 주소)가 있으면 모든 기기가 같은 기록을 봄
let API='', PINV='', syncMsg='', seq=0, pending=0;
let RAW={};
const ISO=/^\d{4}-\d{2}-\d{2}$/;
function normDate(d){d=String(d).trim();if(ISO.test(d))return d;const t=new Date(d);return isNaN(t)?d:ymd(t)}
function setRows(rows){AB={};RAW={};RS={};reasonOK=!rows.length||rows.some(x=>x.length>=4);rows.forEach(([d,n,p,rs])=>{const raw=String(d);d=normDate(d);n=String(n).trim();RAW[d+'|'+n+'|'+(+p)]=raw;if(rs)RS[d+'|'+n]=fixR(String(rs));const r=AB[d]||(AB[d]={});const a=r[n]||(r[n]=[]);if(!a.includes(+p))a.push(+p)})}
async function apiLoad(){
  if(!API||pending)return;const my=++seq;
  try{const r=await fetch(API+'?key='+encodeURIComponent(PINV));const j=await r.json();
    if(my!==seq)return;if(!j.rows)throw 0;setRows(j.rows);syncMsg='';}
  catch(e){if(my===seq)syncMsg='공유 기록을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침을 눌러 주세요.'}
  renderCheck();renderLog();
}
async function apiSet(date,name,period,on){
  const my=++seq;pending++;syncMsg='저장 중…';renderLog();
  try{const r=await fetch(API,{method:'POST',body:JSON.stringify({key:PINV,date:RAW[date+'|'+name+'|'+(+period)]||date,name,period,on})});const j=await r.json();
    if(!j.rows)throw 0;
    const still=j.rows.some(x=>normDate(x[0])===date&&String(x[1]).trim()===name&&+x[2]===+period);
    if(my===seq){setRows(j.rows);syncMsg=(!on&&still)?'삭제가 시트에 반영되지 않았어요. 구글 시트에서 그 줄을 직접 지워 주세요.':(on?'저장했어요.':'삭제했어요.');}}
  catch(e){if(my===seq)syncMsg='저장하지 못했어요. 잠시 후 다시 눌러 주세요.'}
  finally{pending--}
  if(my===seq){renderCheck();renderLog();}
}
async function setReason(date,name,reason){
  if(reason)RS[date+'|'+name]=reason;else delete RS[date+'|'+name];
  if(!API){saveAB();renderLog();return}
  const raw=[1,2].map(p=>RAW[date+'|'+name+'|'+p]).find(Boolean)||date;
  const my=++seq;pending++;syncMsg='사유 저장 중…';renderLog();
  try{const r=await fetch(API,{method:'POST',body:JSON.stringify({key:PINV,action:'reason',date:raw,name,reason})});const j=await r.json();
    if(!j.rows)throw 0;
    if(my===seq){setRows(j.rows);syncMsg=reasonOK?'사유를 저장했어요.':'사유가 시트에 저장되지 않았어요. 구글 시트의 Apps Script 코드를 새 버전으로 바꿔 주세요.';}}
  catch(e){if(my===seq)syncMsg='사유를 저장하지 못했어요. 잠시 후 다시 골라 주세요.'}
  finally{pending--}
  if(my===seq)renderLog();
}
function startSync(){if(!API)return;AB={};apiLoad();setInterval(apiLoad,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)apiLoad()})}
function dateOf(d){const now=new Date();const dow=(now.getDay()+6)%7;const t=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+DAYS.indexOf(d)+wk*7);return t}
const ymd=t=>`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
const lab=k=>{if(!ISO.test(k))return esc(k);const [y,m,d]=k.split('-').map(Number);return `${m}/${d}(${'일월화수목금토'[new Date(y,m-1,d).getDay()]})`};
const NUM=n=>{const i=S.findIndex(s=>s[0]===n);return i<0?99:i+1};
const byNo=(a,b)=>NUM(a[0])-NUM(b[0]);
const periods=a=>a.slice().sort().map(x=>x+'교시').join('·');
function toggle(key,name,per){
  const r=AB[key]||(AB[key]={});const a=r[name]||(r[name]=[]);
  const i=a.indexOf(per), on=i<0;if(on)a.push(per);else a.splice(i,1);
  if(!a.length)delete r[name];if(!Object.keys(r).length)delete AB[key];
  if(API)apiSet(key,name,per,on);else saveAB();
  renderCheck();renderLog();
}
function renderCheck(){
  const key=ymd(dateOf(cur)), rec=AB[key]||{};
  const exp=S.map(s=>({name:s[0],v:st(s,cur)})).filter(o=>o.v.k==='in'||o.v.k==='p1');

  el.innerHTML=`<div class="phead"><div><h2>출석 체크 · ${lab(key)}</h2><p>남아 있어야 하는데 없는 학생의 교시를 누르세요. 다시 누르면 취소돼요.</p></div>
    <div class="wk"><button class="btn" id="wkprev" aria-label="이전 주">◀</button><span style="font-size:13px;min-width:52px;text-align:center">${wkLabel}</span><button class="btn" id="wknext" aria-label="다음 주" ${wk>=0?'disabled':''}>▶</button></div></div>
    ${exp.length?`<div class="cklist">${exp.map(o=>{const a=rec[o.name]||[];const p1=o.v.k==='p1';
      return `<div class="ck ${a.length?'miss':''}"><span class="nm">${NO(o.name)}<span class="nmw">${esc(o.name)}${p1?'<small>1교시만</small>':''}${o.v.note?`<small>${esc(o.v.note)}</small>`:''}</span></span>
      <button data-n="${esc(o.name)}" data-p="1" aria-pressed="${a.includes(1)}">1교시</button>
      <button data-n="${esc(o.name)}" data-p="2" aria-pressed="${a.includes(2)}" ${p1&&!a.includes(2)?'disabled':''}>${p1?'학원':'2교시'}</button></div>`}).join('')}</div>`:'<div class="empty">이 날은 남아야 하는 학생이 없어요.</div>'}`;
  el.querySelectorAll('.ck button').forEach(b=>b.onclick=()=>toggle(key,b.dataset.n,+b.dataset.p));
  document.getElementById('wkprev').onclick=()=>{wk--;renderCheck();renderLog()};
  document.getElementById('wknext').onclick=()=>{if(wk<0){wk++;renderCheck();renderLog()}};
}
// 불참 기록 보기 범위: 'week'(출석 체크에서 고른 주) / 'all'(전체)
let logMode='week';try{if(localStorage.getItem('yaja-logmode')==='all')logMode='all'}catch(e){}
function weekRange(){const mon=dateOf('월');const sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);return [ymd(mon),ymd(sun)]}
function logKeys(){const ks=Object.keys(AB).sort();if(logMode==='all')return ks;const [a,b]=weekRange();return ks.filter(k=>k>=a&&k<=b)}
const shortLab=k=>{const [y,m,d]=k.split('-').map(Number);return `${m}/${d}`};
function logText(){
  const keys=logKeys();
  return keys.map(k=>`${lab(k)} `+Object.entries(AB[k]).sort(byNo).map(([n,a])=>`${NUM(n)}번 ${n}(${periods(a)}${RS[k+'|'+n]?', '+RS[k+'|'+n]:''})`).join(', ')).join('\n');
}
function renderLog(){
  const keys=logKeys().reverse(), any=Object.keys(AB).length;
  const [wa,wb]=weekRange();
  const wkName=wk===0?'이번 주':wk===-1?'지난주':`${-wk}주 전`;
  const rangeTxt=logMode==='all'?'전체 기간':`${wkName} (${shortLab(wa)}~${shortLab(wb)})`;
  const tot={};keys.forEach(k=>Object.entries(AB[k]).forEach(([n,a])=>{const t=tot[n]||(tot[n]={d:0,p:0});t.d++;t.p+=a.length}));
  keys.forEach(k=>Object.keys(AB[k]).forEach(n=>{const r=RS[k+'|'+n];if(r){const t=tot[n];t.rc=t.rc||{};t.rc[r]=(t.rc[r]||0)+1}}));
  Object.values(tot).forEach(t=>{t.r=t.rc?REASONS.filter(x=>t.rc[x]).map(x=>x+' '+t.rc[x]).join(' · '):''});
  const tl=Object.entries(tot).sort(byNo);
  const el=document.getElementById('log');
  el.innerHTML=`<div class="phead"><div><h2>불참 기록 <span style="font-weight:500;color:var(--muted);font-size:13px">(칠판에 현황 기록하는 당번이 체크)</span></h2><p>${API?'누가 어느 기기에서 체크해도 모두에게 같이 보여요. 구글 시트에도 저장돼요.':"이 컴퓨터(브라우저)에만 저장돼요. 다른 기기에서는 안 보이니 가끔 '기록 복사'로 백업해 두세요."}</p></div>
    <div class="wk">${API?'<button class="btn" id="reload">새로고침</button>':''}<span class="seg" role="group" aria-label="보기 범위"><button class="btn ${logMode==='week'?'on':''}" id="modeweek" aria-pressed="${logMode==='week'}">주간</button><button class="btn ${logMode==='all'?'on':''}" id="modeall" aria-pressed="${logMode==='all'}">전체</button></span>${keys.length?`<button class="btn" id="copylog">기록 복사</button>${API?'':`<button class="btn danger" id="clearlog">${clearArmed?'한 번 더 누르면 전부 삭제':'전체 지우기'}</button>`}`:''}</div></div>
    ${syncMsg?`<div class="toast" style="color:${/못/.test(syncMsg)?'var(--x)':'var(--muted)'}">${syncMsg}</div>`:''}
    ${keys.length?`<div><div class="sub">학생별 누적 · ${rangeTxt} (교시 수)</div><div class="totals">${tl.map(([n,t])=>`<span>${NO(n)}${esc(n)} <b>${t.p}</b>${t.r?`<small>${t.r}</small>`:''}</span>`).join('')}</div></div>
    <div class="loglist">${keys.map(k=>`<div class="logday"><span class="d">${lab(k)}</span><span class="who">${Object.entries(AB[k]).sort(byNo).map(([n,a])=>{const id=k+'|'+n;const rs=RS[k+'|'+n]||'';return `<span>${NO(n)}${esc(n)}<em>${periods(a)}</em><select class="rs ${rs==='무단'?'bad':rs?'set':''}" data-k="${k}" data-n="${esc(n)}" aria-label="${esc(n)} 불참 사유"><option value="">사유</option>${REASONS.map(x=>`<option${x===rs?' selected':''}>${x}</option>`).join('')}</select><button class="del ${delArmed===id?'armed':''}" data-k="${k}" data-n="${esc(n)}" aria-label="${esc(n)} ${lab(k)} 기록 삭제">${delArmed===id?'삭제할까요?':'✕'}</button></span>`}).join('')}</span></div>`).join('')}</div>
    <div class="toast" id="toast" role="status"></div><div id="copyfb"></div>`
    :`<div class="empty">${!any?'아직 기록이 없어요. 위 출석 체크에서 교시를 누르면 여기에 날짜별로 쌓여요.':logMode==='all'?'기록이 없어요.':`${rangeTxt}에는 불참 기록이 없어요. 다른 주는 출석 체크의 ◀ 버튼이나 '전체'로 볼 수 있어요.`}</div>`}`;
  const setMode=m=>{logMode=m;try{localStorage.setItem('yaja-logmode',m)}catch(e){}renderLog()};
  document.getElementById('modeweek').onclick=()=>setMode('week');
  document.getElementById('modeall').onclick=()=>setMode('all');
  if(API)document.getElementById('reload').onclick=()=>{syncMsg='불러오는 중…';renderLog();apiLoad()};
  if(!keys.length)return;
  el.querySelectorAll('.rs').forEach(sel=>sel.onchange=()=>setReason(sel.dataset.k,sel.dataset.n,sel.value));
  el.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    const id=b.dataset.k+'|'+b.dataset.n;
    if(delArmed!==id){delArmed=id;renderLog();clearTimeout(delTimer);delTimer=setTimeout(()=>{delArmed='';renderLog()},4000);return}
    delArmed='';removeRec(b.dataset.k,b.dataset.n);
  });
  document.getElementById('copylog').onclick=()=>{
    const txt=logText(), t=document.getElementById('toast');
    const fb=()=>{document.getElementById('copyfb').innerHTML=`<textarea class="copybox" id="copytxt" readonly>${esc(txt)}</textarea>`;const a=document.getElementById('copytxt');a.focus();a.select();t.textContent='아래 글을 Ctrl+C로 복사하세요.'};
    try{navigator.clipboard.writeText(txt).then(()=>{t.textContent='복사했어요. 메모장이나 메신저에 붙여넣으면 돼요.'},fb)}catch(e){fb()}
  };
  if(!API)document.getElementById('clearlog').onclick=()=>{
    if(!clearArmed){clearArmed=true;renderLog();setTimeout(()=>{if(clearArmed){clearArmed=false;renderLog()}},4000);return}
    clearArmed=false;AB={};saveAB();renderCheck();renderLog();
  };
}
function render(){renderTabs();renderDay();renderCheck();renderLog();renderStar();renderGrid()}
async function unlock(pin){
  const d=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(ENC.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(ENC.i)},key,d(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryPin(pin,quiet){
  const msg=document.getElementById('lockmsg');
  try{
    const D=await unlock(pin);S=Array.isArray(D)?D:D.S;API=D.api||'';PINV=D.key||pin;
    try{localStorage.setItem('yaja-pin',pin)}catch(e){}
    document.getElementById('lock').hidden=true;
    document.getElementById('app').hidden=false;
    render();startSync();
  }catch(e){
    if(!quiet){msg.textContent='PIN이 맞지 않아요. 다시 입력해 주세요.';const i=document.getElementById('pin');i.value='';i.focus();}
  }
}
document.getElementById('lockform').addEventListener('submit',e=>{e.preventDefault();tryPin(document.getElementById('pin').value)});
document.getElementById('pin').addEventListener('input',e=>{if(e.target.value.length===4)tryPin(e.target.value)});
let saved=null;try{saved=localStorage.getItem('yaja-pin')}catch(e){}
if(saved)tryPin(saved,true);
</script>
